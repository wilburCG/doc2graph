# Doc2Graph — 一键部署配置

services:
  # ── Neo4j 图数据库 ──
  neo4j:
    image: neo4j:5
    container_name: doc2graph-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser (Web UI)
      - "7687:7687"   # Bolt 协议
    environment:
      NEO4J_AUTH: neo4j/doc2graph
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Doc2Graph API + 前端 ──
  app:
    build: .
    container_name: doc2graph-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: doc2graph
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.openai.com/v1}
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  neo4j_data:
  neo4j_logs:
